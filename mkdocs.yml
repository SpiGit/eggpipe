site_name: Eggpipe
site_description: Документация eggpipe
site_url: https://spigit.github.io/eggpipe/
repo_url: https://github.com/SpiGit/eggpipe
repo_name: SpiGit/eggpipe
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: readthedocs
  logo: assets/brand/png/eggpipe-icon-128.png

nav:
  - Home: index.md
  - Пользователям:
      - Обзор: user/index.md
      - Статус и совместимость: user/status.md
      - Быстрый старт: user/quickstart.md
      - Tutorial: user/tutorial.md
      - Понятия: user/concepts.md
      - Конфигурация: user/configuration.md
      - CLI: user/cli.md
      - API:
          - Обзор: user/api/index.md
          - Generator: user/api/generator.md
          - Format: user/api/format.md
          - Модели: user/api/models.md
      - Cookbook: user/cookbook/index.md
      - Плагины: user/plugins.md
      - Диагностики: user/reference/diagnostics.md
      - Troubleshooting: user/troubleshooting.md
      - FAQ: user/faq.md
  - AI:
      - Обзор: ai/index.md
      - Context: ai/context.md
      - Tasks: ai/tasks.md
      - Invariants: ai/invariants.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
