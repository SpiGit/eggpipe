[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metadata-generator-reference"
version = "0.1.0"
description = "Reference generator for metadata-generator examples and golden tests"
requires-python = ">=3.11"
dependencies = ["metadata-generator"]

[project.entry-points."metadata_generator.generators"]
reference = "reference_generator:ReferenceGenerator"

[tool.hatch.build.targets.wheel]
packages = ["src/reference_generator"]
