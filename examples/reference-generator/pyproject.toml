[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eggpipe-reference"
version = "0.1.0"
description = "Reference generator for eggpipe examples and golden tests"
requires-python = ">=3.11"
dependencies = ["eggpipe"]

[project.entry-points."eggpipe.generators"]
reference = "reference_generator:ReferenceGenerator"

[tool.hatch.build.targets.wheel]
packages = ["src/reference_generator"]
