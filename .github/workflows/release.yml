name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Documentation check
        run: uv run python tools/check_docs.py --strict

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check src tests tools

      - name: Type check
        run: uv run pyrefly check

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

      - name: Build
        run: uv build

      - name: Verify artifacts
        run: uv run python tools/check_wheel.py dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
