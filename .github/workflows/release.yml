name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Verify and build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Documentation check
        run: uv run python tools/check_docs.py --strict

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check src tests tools

      - name: Type check
        run: uv run pyrefly check

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

      - name: Build
        run: uv build

      - name: Verify artifacts
        run: uv run python tools/check_wheel.py dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
