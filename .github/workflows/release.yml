name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Verify and build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Documentation check
        run: uv run python tools/check_docs.py --strict

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check src tests tools examples

      - name: Type check
        run: uv run pyrefly check

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

      - name: Build
        run: uv build

      - name: Verify artifacts
        run: uv run python tools/check_wheel.py dist

      - name: Generate SBOM
        run: |
          mkdir -p sbom
          uv export --frozen --no-dev --no-extra dev --no-extra watch --no-extra jinja --no-hashes --format requirements-txt --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uv run --with 'cyclonedx-bom==8.0.1' cyclonedx-py requirements "$RUNNER_TEMP/requirements.txt" --of JSON --pyproject pyproject.toml --output-file sbom/sbom.cdx.json --validate

      - name: Verify SBOM
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("sbom/sbom.cdx.json").read_text(encoding="utf-8"))
          names = {item.get("name", "").lower() for item in data.get("components", [])}
          forbidden = {"pytest", "pytest-cov", "ruff", "pyrefly", "mkdocs", "hypothesis"}
          bad = sorted(names & forbidden)
          if bad:
              raise SystemExit(f"dev dependencies leaked into SBOM: {bad}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@v7
        with:
          name: sbom
          path: sbom/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* sbom/* --generate-notes --verify-tag

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
