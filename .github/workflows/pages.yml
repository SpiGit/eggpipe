name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Resolve docs version
        run: |
          version=$(uv run python -c "import pathlib, tomllib; print('.'.join(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'].split('.')[:2]))")
          echo "DOCS_VERSION=$version" >> "$GITHUB_ENV"

      - name: Deploy versioned docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run mike deploy --branch gh-pages --ignore-remote-status --alias-type redirect --update-aliases "$DOCS_VERSION" latest
          uv run mike set-default --branch gh-pages --ignore-remote-status latest
          mkdir -p /tmp/pages
          git archive gh-pages | tar -x -C /tmp/pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/pages

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
